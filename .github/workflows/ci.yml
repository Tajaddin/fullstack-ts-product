name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgres://coursemates:coursemates@localhost:5432/coursemates
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-secret-0123456789abcdef
  APP_URL: http://localhost:3100
  AUTH_URL: http://localhost:3100

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx next typegen && npm run typecheck
      - run: npm run test:unit

  migrations:
    name: migrations apply from zero and match the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: coursemates, POSTGRES_PASSWORD: coursemates, POSTGRES_DB: coursemates }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U coursemates" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: apply with the runtime migrator (what the release command runs)
        run: npx tsx scripts/migrate.ts
      - name: drizzle-kit agrees and the schema has no un-generated changes
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          git diff --exit-code -- drizzle
      - run: npm run seed

  integration:
    name: integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/integration --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage, retention-days: 7 }

  e2e:
    name: end to end + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: coursemates, POSTGRES_PASSWORD: coursemates, POSTGRES_DB: coursemates }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U coursemates" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/migrate.ts && npm run seed
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse CI (mobile, scores >= 90)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: coursemates, POSTGRES_PASSWORD: coursemates, POSTGRES_DB: coursemates }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U coursemates" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/migrate.ts && npm run seed
      - run: npm run build
      - run: |
          npm run start &
          for i in $(seq 1 30); do curl -fsS http://localhost:3100/api/health && break; sleep 2; done
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7 }

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target web -t coursemates/web:ci .
      - run: docker build --target worker -t coursemates/worker:ci .
      - run: docker image ls coursemates/web:ci coursemates/worker:ci --format '{{.Repository}} {{.Size}}'
