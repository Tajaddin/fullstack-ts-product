name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  fly:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: worker (runs migrations as its release command)
        run: flyctl deploy -c fly.worker.toml --remote-only
      - name: web
        run: |
          flyctl deploy -c fly.toml --remote-only \
            --build-arg "NEXT_PUBLIC_POSTHOG_KEY=${VARS_NEXT_PUBLIC_POSTHOG_KEY}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${VARS_NEXT_PUBLIC_SENTRY_DSN}" \
            --build-arg "NEXT_PUBLIC_CONTACT=${VARS_NEXT_PUBLIC_CONTACT}" \
            --build-arg "APP_URL=${VARS_APP_URL}"
        env:
          VARS_NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          VARS_NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          VARS_NEXT_PUBLIC_CONTACT: ${{ vars.NEXT_PUBLIC_CONTACT }}
          VARS_APP_URL: ${{ vars.APP_URL }}
      - run: curl -fsS "${VARS_APP_URL}/api/health"
        env:
          VARS_APP_URL: ${{ vars.APP_URL }}
